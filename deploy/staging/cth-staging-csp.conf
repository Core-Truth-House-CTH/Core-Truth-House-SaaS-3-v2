# Staging only. Install as /etc/nginx/snippets/cth-staging-csp.conf and include it ONLY in the
# staging.coretruthhouse.com (frontend) server block, never on any production host.
#
# connect-src limits where the browser may send requests (fetch, XHR, websockets). Even if a
# production address slipped into a build, the browser would refuse to call it.
# "always" so the header is also sent on 401/404 pages. Do not add add_header lines inside
# location blocks of that server without repeating this line (nginx does not inherit them).
add_header Content-Security-Policy "connect-src 'self' https://staging-api.coretruthhouse.com https://*.clerk.accounts.dev https://clerk-telemetry.com https://api.stripe.com" always;
