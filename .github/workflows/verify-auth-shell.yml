name: Verify Shared Auth Shell

on:
  push:
    branches:
      - "feat/command-center-shell"
    paths:
      - "src/components/AuthShell.jsx"
      - "src/pages/CommandCenterNext.jsx"
      - "src/pages/WorkspacePage.jsx"
      - "src/pages/ReportsShell.jsx"
      - "src/navigation/pageRegistry.jsx"
      - "src/styles/auth-shell.css"
      - "src/styles/auth-shell-enhancements.css"
      - "src/styles/command-center-next.css"
      - "src/styles/reports-shell-bridge.css"
      - "public/command-center-assets/cth-logo-seal.png"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/verify-auth-shell.yml"
  pull_request:
    paths:
      - "src/components/AuthShell.jsx"
      - "src/pages/CommandCenterNext.jsx"
      - "src/pages/WorkspacePage.jsx"
      - "src/pages/ReportsShell.jsx"
      - "src/navigation/pageRegistry.jsx"
      - "src/styles/auth-shell.css"
      - "src/styles/auth-shell-enhancements.css"
      - "src/styles/command-center-next.css"
      - "src/styles/reports-shell-bridge.css"
      - "public/command-center-assets/cth-logo-seal.png"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/verify-auth-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Production build
        run: yarn build
