name: CTH Governance Gate
on:
  pull_request:
    branches: [main, release/core-truth-house-production, "integration/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref: { description: Trusted comparison base, required: true, type: string }
      head_sha: { description: Exact source head SHA, required: true, type: string }
      merge_sha: { description: Exact tested merge SHA, required: true, type: string }
      base_sha: { description: Exact base SHA, required: true, type: string }
concurrency:
  group: cth-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CTH_BASE_REF: ${{ github.base_ref || inputs.base_ref }}
  CTH_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
  CTH_MERGE_SHA: ${{ github.sha || inputs.merge_sha }}
  CTH_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
  CTH_ARTIFACT_NAME: cth-frontend-${{ github.event.pull_request.head.sha || inputs.head_sha }}
  CTH_YARN_VERSION: 1.22.22
jobs:
  verify:
    name: Locked install, tests, contracts, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with: { node-version: "22.12.0", cache: yarn }
      - name: Activate repository Yarn version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Verify lockfile stability
        run: git diff --exit-code -- yarn.lock
      - name: Lint
        run: yarn lint
      - name: Run automated tests
        run: yarn test:ci
      - name: Verify route contract
        run: yarn check:routes
      - name: Verify architecture boundaries
        run: yarn check:architecture
      - name: Verify deployment policy
        run: yarn check:deployment
      - name: Build production artifact
        run: yarn build
      - name: Verify build output
        run: test -f dist/index.html
      - name: Create artifact identity manifest
        run: node scripts/create-artifact-manifest.mjs create
      - name: Verify artifact identity manifest
        run: node scripts/create-artifact-manifest.mjs verify
      - name: Upload tested artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CTH_ARTIFACT_NAME }}
          path: |
            dist/
            artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
